name: FXRacing
options:
  bundleIdPrefix: com.fxracing
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Performance: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    MARKETING_VERSION: "1.7.1"
    CURRENT_PROJECT_VERSION: "44"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  FXRacing:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXRacing
    info:
      path: FXRacing/Info.plist
      properties:
        CFBundleDisplayName: FX Racing
        CFBundleIdentifier: com.fxracing.app
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: FXRacing/FXRacing.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fxracing.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U6Z87CS4W3
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Performance:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: FX_PERF_HARNESS
          SUPPORTED_PLATFORMS: iphonesimulator
          CODE_SIGNING_ALLOWED: NO
          ENABLE_TESTABILITY: YES
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"

  FXRacingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXRacingTests
    dependencies:
      - target: FXRacing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fxracing.app.tests
        GENERATE_INFOPLIST_FILE: YES

  FXRacingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FXRacingUITests
    dependencies:
      - target: FXRacing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fxracing.app.uitests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Performance:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: FX_PERF_HARNESS

schemes:
  FXRacing:
    build:
      targets:
        FXRacing: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FXRacingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FXRacingPerformance:
    build:
      targets:
        FXRacing: all
    run:
      config: Performance
    test:
      config: Performance
      debugEnabled: false
      disableMainThreadChecker: true
      targets:
        - FXRacingUITests
    profile:
      config: Performance
    analyze:
      config: Performance
    archive:
      config: Release
